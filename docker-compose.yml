services:
  mysql:
    image: mysql:8.4
    container_name: ssf-autodesign-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ssf_autodesign
      MYSQL_USER: ssf
      MYSQL_PASSWORD: ssf_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ussf", "-pssf_password"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ssf-autodesign-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ssf_autodesign?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ssf
      SPRING_DATASOURCE_PASSWORD: ssf_password
      SSF_DATA_ROOT: /data
      SSF_DEMO_ENABLED: "true"
      SSF_DEMO_WORKSPACE_PATH: /demo/ssf-workspace
    volumes:
      - app-data:/data
      - ./demo:/demo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: ssf-autodesign-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://backend:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  app-data:
  mysql-data:
